name: Android non-adult validation

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-non-adult.yml"
  push:
    branches:
      - main
      - feat/android-non-adult-edition
    paths:
      - "apps/android/**"
      - ".github/workflows/android-non-adult.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npx expo export --platform android
